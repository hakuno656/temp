<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Iniciar sesión | ThermoRGB</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/estilo.css') }}"
    >
</head>

<body class="login-page">

    <main class="login-card">

        <div class="logo">°C</div>

        <p class="eyebrow">
            MONITOREO AMBIENTAL
        </p>

        <h1>Iniciar sesión</h1>

        <p class="muted">
            Ingresa para consultar el sensor DHT11.
        </p>

        {% if error %}
            <div class="alert">
                {{ error }}
            </div>
        {% endif %}

        <form method="POST">

            <label for="usuario">
                Usuario
            </label>

            <input
                type="text"
                id="usuario"
                name="usuario"
                autocomplete="username"
                required
            >

            <label for="password">
                Contraseña
            </label>

            <input
                type="password"
                id="password"
                name="password"
                autocomplete="current-password"
                required
            >

            <button type="submit">
                Entrar al panel
            </button>

        </form>

        <p class="footnote">
            Acceso protegido
        </p>

    </main>

</body>

</html>
